---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kividbaclconfigs.kividb.io
  labels:
    app.kubernetes.io/name: kividb-operator
    app.kubernetes.io/managed-by: kividb-operator
spec:
  group: kividb.io
  names:
    kind: KividbAclConfig
    listKind: KividbAclConfigList
    plural: kividbaclconfigs
    singular: kividbaclconfig
    shortNames:
      - kdbacl
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            KividbAclConfig is a reusable, standalone set of ACL users.
            Create one and reference it by name from any number of
            KividbClusters' spec.aclConfigRef.
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                requirePassSecretRef:
                  type: object
                  required: [name, key]
                  properties:
                    name: {type: string}
                    key: {type: string}
                users:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      enabled: {type: boolean}
                      noPass: {type: boolean}
                      passwordSecretRef:
                        type: object
                        required: [name, key]
                        properties:
                          name: {type: string}
                          key: {type: string}
                      keyPatterns:
                        type: array
                        items: {type: string}
                      channelPatterns:
                        type: array
                        items: {type: string}
                      commandRules:
                        type: array
                        items: {type: string}
