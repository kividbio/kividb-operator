name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  go:
    name: Go build / vet / test / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Go release in go.mod's `toolchain` line, the one the image
      # builds use too.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # go.mod and go.sum must already be tidy. When they are not, the
      # tidied files are kept as the go-mod-tidy artifact.
      - name: go mod tidy (no diff)
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy: run 'go mod tidy' and commit the result (also in the go-mod-tidy artifact)"
            exit 1
          fi

      - name: upload tidied go.mod/go.sum
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: go-mod-tidy
          path: |
            go.mod
            go.sum
          if-no-files-found: ignore

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race -coverprofile=cover.out

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out
          if-no-files-found: ignore

  helm:
    name: Helm lint / template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: helm lint
        run: helm lint charts/kividb-operator

      - name: helm template (sanity render)
        run: helm template kividb-operator charts/kividb-operator > /dev/null

  # Native per-arch builds (no QEMU): amd64 on ubuntu-latest, arm64 on
  # ubuntu-24.04-arm. Mirrors the release workflow's model so CI catches
  # Dockerfile breakage on both arches without emulated builds.
  docker:
    name: Docker build ${{ matrix.name }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manager
            dockerfile: ./Dockerfile
            tag: kividb-operator:ci
            platform: linux/amd64
            runner: ubuntu-latest
          - name: manager
            dockerfile: ./Dockerfile
            tag: kividb-operator:ci
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - name: agent
            dockerfile: ./Dockerfile.agent
            tag: kividb-operator-agent:ci
            platform: linux/amd64
            runner: ubuntu-latest
          - name: agent
            dockerfile: ./Dockerfile.agent
            tag: kividb-operator-agent:ci
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - name: gui
            dockerfile: ./Dockerfile.gui
            tag: kividb-operator-gui:ci
            platform: linux/amd64
            runner: ubuntu-latest
            optional: true
          - name: gui
            dockerfile: ./Dockerfile.gui
            tag: kividb-operator-gui:ci
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            optional: true
    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [ "${{ matrix.optional }}" = "true" ]; then
              echo "::warning::${{ matrix.dockerfile }} not found, skipping"
            else
              echo "::error::${{ matrix.dockerfile }} required but missing"
              exit 1
            fi
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.present == 'true'

      - name: Build ${{ matrix.name }} (${{ matrix.platform }})
        if: steps.check.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          provenance: false
          tags: ${{ matrix.tag }}

  # Trivy scan of the three images; fails on a fixable HIGH or CRITICAL.
  # The release workflow runs the same scan before it pushes anything.
  image-scan:
    name: Image scan
    uses: ./.github/workflows/image-scan.yaml
