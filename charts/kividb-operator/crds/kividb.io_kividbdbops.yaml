---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kividbdbops.kividb.io
  labels:
    app.kubernetes.io/name: kividb-operator
    app.kubernetes.io/managed-by: kividb-operator
spec:
  group: kividb.io
  names:
    kind: KividbDbOps
    listKind: KividbDbOpsList
    plural: kividbdbops
    singular: kividbdbops
    shortNames:
      - kdbops
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Cluster
          type: string
          jsonPath: .spec.clusterRef.name
        - name: Op
          type: string
          jsonPath: .spec.op
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            KividbDbOps is a declarative database operation (e.g. rolling
            restart) against a KividbCluster.
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [clusterRef, op]
              properties:
                clusterRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string}
                op:
                  type: string
                  enum: [restart]
                restart:
                  type: object
                  properties:
                    method:
                      type: string
                      enum: [InPlace]
                      default: InPlace
                    onlyPendingRestart:
                      type: boolean
                maxRetries:
                  type: integer
                  format: int32
                  minimum: 0
                  default: 0
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Completed, Failed]
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
                message:
                  type: string
                error:
                  type: string
                restart:
                  type: object
                  properties:
                    completedPods:
                      type: array
                      items: {type: string}
                    pendingPods:
                      type: array
                      items: {type: string}
                    currentPod:
                      type: string
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string}
                      message: {type: string}
