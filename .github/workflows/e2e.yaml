name: E2E

on:
  pull_request:
    branches: [master, main]
    paths:
      - "internal/**"
      - "cmd/**"
      - "api/**"
      - "config/**"
      - "charts/**"
      - "hack/e2e/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: E2E Integration (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.15.4

      - name: Install redis-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Create kind cluster
        uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0
        with:
          cluster_name: kind

      - name: Build local operator images
        run: |
          VERSION="$(cat VERSION)-ci"
          docker build -t "docker.io/kividb/kividb-operator:${VERSION}" -f Dockerfile .
          docker build -t "docker.io/kividb/kividb-operator-agent:${VERSION}" -f Dockerfile.agent .
          docker build -t "docker.io/kividb/kividb-operator-gui:${VERSION}" -f Dockerfile.gui .

      - name: Run core E2E suites
        run: |
          VERSION="$(cat VERSION)-ci"
          CLUSTER_DRIVER=kind LOAD_IMAGES=1 OPERATOR_TAG="${VERSION}" STOP_ON_FAIL=1 \
          SKIP_PROMETHEUS=1 SKIP_MINIO=1 SKIP_SNAPSHOT=1 SKIP_MONITOR=1 SKIP_FAILOVER=1 \
          ./hack/e2e/run-all.sh

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: e2e-results
          path: hack/e2e/results/
          if-no-files-found: ignore
