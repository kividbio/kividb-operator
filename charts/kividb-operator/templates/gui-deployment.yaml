{{- if .Values.gui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kividb-operator.gui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kividb-operator.gui.labels" . | nindent 4 }}
    app.kubernetes.io/component: gui
spec:
  replicas: {{ .Values.gui.replicaCount }}
  selector:
    matchLabels:
      {{- include "kividb-operator.gui.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gui
  template:
    metadata:
      labels:
        {{- include "kividb-operator.gui.labels" . | nindent 8 }}
        app.kubernetes.io/component: gui
        {{- with .Values.gui.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.gui.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kividb-operator.gui.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: gui
          image: "{{ .Values.gui.image.repository }}:{{ .Values.gui.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.gui.image.pullPolicy }}
          env:
            - name: GUI_PORT
              value: {{ .Values.gui.service.port | quote }}
            {{- if .Values.watchNamespace }}
            - name: WATCH_NAMESPACE
              value: {{ .Values.watchNamespace | quote }}
            {{- end }}
            {{- if .Values.gui.auth.existingSecret }}
            - name: GUI_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gui.auth.existingSecret | quote }}
                  key: {{ .Values.gui.auth.usernameKey | default "username" | quote }}
            - name: GUI_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gui.auth.existingSecret | quote }}
                  key: {{ .Values.gui.auth.passwordKey | default "password" | quote }}
            {{- end }}
            {{- if .Values.gui.metrics.persistence.enabled }}
            - name: GUI_METRICS_DIR
              value: /var/lib/kividb-gui
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.gui.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gui.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.gui.metrics.persistence.enabled }}
            - name: metrics
              mountPath: /var/lib/kividb-gui
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.gui.metrics.persistence.enabled }}
        - name: metrics
          persistentVolumeClaim:
            claimName: {{ include "kividb-operator.gui.fullname" . }}-metrics
        {{- end }}
      {{- with .Values.gui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
