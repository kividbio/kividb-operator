---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kividbsnapshots.kividb.io
  labels:
    app.kubernetes.io/name: kividb-operator
    app.kubernetes.io/managed-by: kividb-operator
spec:
  group: kividb.io
  names:
    kind: KividbSnapshot
    listKind: KividbSnapshotList
    plural: kividbsnapshots
    singular: kividbsnapshot
    shortNames:
      - kdbs
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Cluster
          type: string
          jsonPath: .spec.clusterRef.name
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Object Key
          type: string
          jsonPath: .status.objectKey
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            KividbSnapshot records the outcome of a single backup run:
            which pod it was taken from, whether it succeeded, and the
            exact S3 object it produced. Created and managed by the
            operator, one per run of the owning KividbSnapshotConfig's
            schedule -- you don't normally create these yourself.
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [clusterRef, snapshotConfigRef]
              properties:
                clusterRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string}
                snapshotConfigRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string}
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, InProgress, Succeeded, Failed]
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
                sourcePod:
                  type: string
                sourceRole:
                  type: string
                objectKey:
                  type: string
                sizeBytes:
                  type: integer
                  format: int64
                durationMs:
                  type: integer
                  format: int64
                error:
                  type: string
