---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kividbclusters.kividb.io
  labels:
    app.kubernetes.io/name: kividb-operator
    app.kubernetes.io/managed-by: kividb-operator
spec:
  group: kividb.io
  names:
    kind: KividbCluster
    listKind: KividbClusterList
    plural: kividbclusters
    singular: kividbcluster
    shortNames:
      - kdb
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Master
          type: string
          jsonPath: .status.masterPod
        - name: Shards
          type: integer
          jsonPath: .spec.shards
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            KividbCluster describes a single-master, N-replica KiviDB
            (Redis-compatible) cluster: storage, scheduling constraints,
            exposed Services, monitoring, and failover behavior.
            Configuration, ACL users, and scheduled backups are set via
            separate KividbConfig / KividbAclConfig / KividbSnapshotConfig
            resources, referenced by name.
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [storage]
              x-kubernetes-validations:
                - rule: "has(self.shards) == has(oldSelf.shards)"
                  message: "spec.shards cannot be added or removed after creation: a cluster is sharded, or not, for good"
              properties:
                shards:
                  type: integer
                  minimum: 1
                  description: >-
                    Makes the cluster sharded: that many shards, each a master
                    and spec.replicas replicas, in kividb's cluster mode. Unset:
                    one master and its replicas. Set or unset only at creation;
                    the number can change later.
                cluster:
                  type: object
                  description: Cluster-mode settings, for a cluster with spec.shards.
                  properties:
                    nodeTimeoutMs:
                      type: integer
                      minimum: 1000
                      description: cluster-node-timeout in milliseconds. Defaults to 5000.
                    requireFullCoverage:
                      type: boolean
                      description: cluster-require-full-coverage. Defaults to true.
                    minReplicasToWrite:
                      type: integer
                      minimum: 0
                      description: min-replicas-to-write. 0 (the default) turns it off.
                    minReplicasMaxLagSeconds:
                      type: integer
                      minimum: 1
                      description: min-replicas-max-lag. Defaults to 10.
                    busSecretRef:
                      type: object
                      description: The cluster-bus-secret. Generated into <cluster>-bus when unset.
                      required: [name, key]
                      properties:
                        name: {type: string}
                        key: {type: string}
                replicas:
                  type: integer
                  minimum: 0
                  default: 2
                  description: Number of replicas of each master (beside the single master, or in each shard).
                image:
                  type: string
                  description: >-
                    kividb container image, e.g.
                    "docker.io/kividb/kividb:v1.1.2". Defaults to
                    docker.io/kividb/kividb:v1.1.2 if unset -- set this explicitly
                    to pin a version. Used verbatim; never derived or
                    modified from variant below.
                variant:
                  type: string
                  default: standard
                  enum: [standard, tls, lua, full]
                  description: >-
                    Declares which build of kividb image actually is:
                    informational only, does not change which image gets
                    pulled. Tells the operator whether to wire up
                    variant-specific configuration (TLS cert mounting/CLI
                    flags). Not validated against image -- the operator
                    emits a guidance Event on a likely mismatch instead.
                imagePullPolicy:
                  type: string
                  enum: [Always, IfNotPresent, Never]
                imagePullSecrets:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                agentImage:
                  type: string
                  description: kividb-operator sidecar agent image. Defaults to the operator's bundled version.
                exporterImage:
                  type: string
                  description: >-
                    Prometheus redis_exporter sidecar image, added only when
                    spec.monitoring.enabled is true. Defaults to the
                    operator's bundled oliver006/redis_exporter version.
                port:
                  type: integer
                  default: 6380
                  description: RESP protocol port kividb listens on.
                configRef:
                  type: object
                  required: [name]
                  description: >-
                    Names a KividbConfig in the same namespace, providing
                    kividb.conf directives and TLS settings. Optional.
                  properties:
                    name: {type: string}
                aclConfigRef:
                  type: object
                  required: [name]
                  description: >-
                    Names a KividbAclConfig in the same namespace, providing
                    ACL users and/or requirepass. Optional: omit for an
                    open, passwordless default user.
                  properties:
                    name: {type: string}
                snapshotConfigRef:
                  type: object
                  required: [name]
                  description: >-
                    Names a KividbSnapshotConfig in the same namespace,
                    providing the backup schedule and S3 destination.
                    Optional: omit to disable scheduled backups.
                  properties:
                    name: {type: string}
                bootstrapFromSnapshot:
                  type: object
                  description: >-
                    Seed a brand-new cluster's pod-0 data volume from a
                    successful KividbSnapshot before kividb starts. Only
                    honored until status.bootstrap.completed is true.
                  required: [snapshotRef]
                  properties:
                    snapshotRef:
                      type: object
                      required: [name]
                      properties:
                        name: {type: string}
                storage:
                  type: object
                  required: [size]
                  properties:
                    size:
                      type: string
                      description: 'PVC capacity, e.g. "10Gi".'
                      pattern: '^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$'
                    storageClassName:
                      type: string
                    accessModes:
                      type: array
                      items: {type: string}
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Standard Kubernetes ResourceRequirements for the kividb container.
                agentResources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Standard Kubernetes ResourceRequirements for the agent sidecar container.
                exporterResources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Standard Kubernetes ResourceRequirements for the redis_exporter sidecar container.
                tolerations:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  description: Standard Kubernetes Tolerations applied to every pod.
                nodeSelector:
                  type: object
                  additionalProperties: {type: string}
                affinity:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Standard Kubernetes Affinity. If unset, a default preferred anti-affinity is injected.
                podAnnotations:
                  type: object
                  additionalProperties: {type: string}
                podLabels:
                  type: object
                  additionalProperties: {type: string}
                terminationGracePeriodSeconds:
                  type: integer
                  format: int64
                services:
                  type: object
                  properties:
                    master:
                      type: object
                      description: Service exposing the current master pod.
                      properties:
                        type:
                          type: string
                          enum: [ClusterIP, NodePort, LoadBalancer]
                        loadBalancerIP: {type: string}
                        loadBalancerSourceRanges:
                          type: array
                          items: {type: string}
                        annotations:
                          type: object
                          additionalProperties: {type: string}
                    replicas:
                      type: object
                      description: Service load-balancing across all replica pods.
                      properties:
                        type:
                          type: string
                          enum: [ClusterIP, NodePort, LoadBalancer]
                        loadBalancerIP: {type: string}
                        loadBalancerSourceRanges:
                          type: array
                          items: {type: string}
                        annotations:
                          type: object
                          additionalProperties: {type: string}
                monitoring:
                  type: object
                  properties:
                    enabled: {type: boolean}
                    serviceMonitor: {type: boolean}
                failover:
                  type: object
                  properties:
                    enabled: {type: boolean}
                    unhealthyThresholdSeconds:
                      type: integer
                      format: int32
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Provisioning, Running, Degraded, FailingOver, Rebalancing, Error]
                masterPod:
                  type: string
                pods:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      role: {type: string}
                      ready: {type: boolean}
                      synced: {type: boolean}
                      keys:
                        type: integer
                        format: int64
                      replicationOffset:
                        type: integer
                        format: int64
                      shard:
                        type: integer
                      nodeID:
                        type: string
                shards:
                  type: array
                  items:
                    type: object
                    required: [index]
                    properties:
                      index: {type: integer}
                      masterPod: {type: string}
                      masterNodeID: {type: string}
                      slots:
                        type: array
                        items: {type: string}
                      pods:
                        type: array
                        items: {type: string}
                      readyPods: {type: integer}
                cluster:
                  type: object
                  properties:
                    state: {type: string}
                    slotsAssigned: {type: integer}
                    slotsFail: {type: integer}
                    knownNodes: {type: integer}
                    currentEpoch:
                      type: integer
                      format: int64
                    staleNodeIDs:
                      type: array
                      items: {type: string}
                lastFailoverTime:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                bootstrap:
                  type: object
                  description: Snapshot-bootstrap progress for this cluster.
                  properties:
                    phase:
                      type: string
                      enum: [Pending, InProgress, Completed, Failed]
                    snapshotName: {type: string}
                    completed: {type: boolean}
                    message: {type: string}
                    error: {type: string}
                    completionTime:
                      type: string
                      format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
