name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Keep in sync with go.mod's `go` directive (and the golang:*-bookworm
  # builder image in the Dockerfiles).
  GO_VERSION: "1.25"

jobs:
  go:
    name: Go build / vet / test / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # go.sum is not committed yet (see docs/_internal-spec.md) -- `go mod
      # tidy` fetches and pins real module versions/checksums. GitHub-hosted
      # runners have network access, so this is expected to succeed here
      # even though it cannot be run in the sandboxed environment the
      # initial source was written in.
      - name: go mod tidy
        run: go mod tidy

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race -coverprofile=cover.out

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out
          if-no-files-found: ignore

  helm:
    name: Helm lint / template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: helm lint
        run: helm lint charts/kividb-operator

      - name: helm template (sanity render)
        run: helm template kividb-operator charts/kividb-operator > /dev/null

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build manager image (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          tags: kividb-operator:ci

      - name: Build agent image (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          tags: kividb-operator-agent:ci

      - name: Check for GUI Dockerfile
        id: gui
        run: |
          if [ -f Dockerfile.gui ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build GUI image (linux/amd64 + linux/arm64)
        if: steps.gui.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gui
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          tags: kividb-operator-gui:ci
