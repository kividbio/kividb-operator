---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kividbconfigs.kividb.io
  labels:
    app.kubernetes.io/name: kividb-operator
    app.kubernetes.io/managed-by: kividb-operator
spec:
  group: kividb.io
  names:
    kind: KividbConfig
    listKind: KividbConfigList
    plural: kividbconfigs
    singular: kividbconfig
    shortNames:
      - kdbc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            KividbConfig is a reusable, standalone set of kividb.conf
            directives (and TLS settings). Create one and reference it by
            name from any number of KividbClusters' spec.configRef.
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                directives:
                  type: object
                  additionalProperties:
                    type: string
                  description: >-
                    Free-form kividb.conf directives (lower-kebab-case keys,
                    e.g. maxmemory, threads, aof, loglevel, cluster-enabled,
                    notify-keyspace-events, slowlog-log-slower-than). Do not
                    set "replicaof", "port", or "aclfile" here -- those
                    remain operator-managed regardless of which KividbConfig
                    is referenced.
                tls:
                  type: object
                  description: >-
                    TLS listener settings. Requires a KividbCluster with
                    spec.variant "tls" or "full".
                  required: [certSecretRef]
                  properties:
                    enabled:
                      type: boolean
                    port:
                      type: integer
                      default: 6443
                      description: TLS listener port. Defaults to 6443.
                    certSecretRef:
                      type: object
                      required: [name]
                      properties:
                        name:
                          type: string
                        certKey:
                          type: string
                          description: Defaults to "tls.crt".
                        keyKey:
                          type: string
                          description: Defaults to "tls.key".
                        caKey:
                          type: string
                          description: >-
                            Defaults to "ca.crt". Optional -- set only if
                            client-cert verification is desired and this
                            key actually exists in the Secret.
