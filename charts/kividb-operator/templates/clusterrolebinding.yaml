{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
# With watchNamespace set, a RoleBinding to the Role in that namespace.
{{- if .Values.watchNamespace }}
kind: RoleBinding
{{- else }}
kind: ClusterRoleBinding
{{- end }}
metadata:
  # Named after the role it binds: roleRef cannot change on an existing
  # binding, so when the role's name changes (it took the release's name,
  # #97), helm upgrade creates a new binding and deletes the old one,
  # instead of failing to patch it.
  name: {{ include "kividb-operator.clusterRoleName" . }}
  {{- if .Values.watchNamespace }}
  namespace: {{ .Values.watchNamespace }}
  {{- end }}
  labels:
    {{- include "kividb-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  {{- if .Values.watchNamespace }}
  kind: Role
  {{- else }}
  kind: ClusterRole
  {{- end }}
  name: {{ include "kividb-operator.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kividb-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
