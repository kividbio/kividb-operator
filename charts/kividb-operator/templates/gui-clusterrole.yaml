{{- if and .Values.gui.enabled .Values.rbac.create }}
# Management GUI ClusterRole. Still never grants Secrets. Extends the
# read-only surface with create on kividbdbops (restart ops) and get on
# pods/log (log viewer). Mirrors config/gui/rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kividb-operator.fullname" . }}-gui-role
  labels:
    {{- include "kividb-operator.gui.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - kividb.io
    resources:
      - kividbclusters
    verbs:
      - get
      - list
      - watch
      - patch
      - update
      - delete
  - apiGroups:
      - kividb.io
    resources:
      - kividbsnapshotconfigs
      - kividbsnapshots
      - kividbdbops
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kividb.io
    resources:
      - kividbdbops
    verbs:
      - create
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - cronjobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ""
    resources:
      - services
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
{{- end }}
