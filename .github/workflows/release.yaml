name: Release

# Triggered by pushing a tag matching v<semver>, e.g. v0.5.0. Release
# checklist (see docs/RELEASING.md):
#   1. Bump VERSION and charts/kividb-operator/Chart.yaml (version AND
#      appVersion) to the same new version.
#   2. Update CHANGELOG.md with a new "## [x.y.z] - YYYY-MM-DD" section.
#   3. Commit, merge to master.
#   4. `git tag vx.y.z && git push origin vx.y.z` -- this workflow does
#      the rest: builds all three images, publishes each to GHCR and Docker
#      Hub tagged both `x.y.z` and `latest`, pushes the Helm chart as an OCI
#      artifact to both, and creates a GitHub Release with notes from
#      CHANGELOG.md and the packaged chart .tgz attached.
#
# Registries, as for kividb itself:
#   ghcr.io/kividbio/<image>   pushed by the per-arch builds (GITHUB_TOKEN)
#   docker.io/kividb/<image>   the same multi-arch tags, copied from GHCR
#                              (vars.DOCKERHUB_USERNAME, secrets.DOCKERHUB_TOKEN)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  GHCR: ghcr.io/kividbio
  DOCKERHUB: docker.io/kividb

jobs:
  version-check:
    name: Verify tag matches VERSION/Chart.yaml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute and cross-check version
        id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file_version="$(cat VERSION | tr -d '[:space:]')"
          chart_version="$(grep '^version:' charts/kividb-operator/Chart.yaml | awk '{print $2}')"
          chart_app_version="$(grep '^appVersion:' charts/kividb-operator/Chart.yaml | tr -d '\"' | awk '{print $2}')"
          echo "tag=$tag VERSION=$file_version chart.version=$chart_version chart.appVersion=$chart_app_version"
          if [ "$tag" != "$file_version" ] || [ "$tag" != "$chart_version" ] || [ "$tag" != "$chart_app_version" ]; then
            echo "::error::Tag v$tag does not match VERSION ($file_version) / Chart.yaml version ($chart_version) / appVersion ($chart_app_version). Bump them together before tagging."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  # Fails the release before anything is built when Docker Hub cannot be
  # reached, instead of publishing to GHCR only.
  dockerhub-check:
    name: Check Docker Hub credentials
    runs-on: ubuntu-latest
    steps:
      - name: Credentials are set
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME variable and the DOCKERHUB_TOKEN secret (a Docker Hub access token with Read & Write on the kividb/kividb-operator* repositories)."
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  # Native multi-arch: each arch builds on a matching GitHub-hosted runner
  # (ubuntu-latest = amd64, ubuntu-24.04-arm = arm64). No QEMU. Each job
  # pushes to GHCR by digest only; images-manifest stitches the digests into
  # the versioned + latest tags as a real multi-arch OCI index.
  images:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    needs: [version-check, dockerhub-check]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kividb-operator
            dockerfile: Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - image: kividb-operator
            dockerfile: Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: kividb-operator-agent
            dockerfile: Dockerfile.agent
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - image: kividb-operator-agent
            dockerfile: Dockerfile.agent
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: kividb-operator-gui
            dockerfile: Dockerfile.gui
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - image: kividb-operator-gui
            dockerfile: Dockerfile.gui
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.GHCR }}/${{ matrix.image }},push-by-digest=true,name-canonical=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          echo "${digest#sha256:}" > "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          # "--" before the arch: image names share prefixes
          # (kividb-operator, kividb-operator-agent, ...), so with a single
          # "-" the merge job's pattern for one image also matched the
          # others' digests.
          name: digests-${{ matrix.image }}--${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  images-manifest:
    name: Merge multi-arch manifests
    needs: [version-check, images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kividb-operator
          - image: kividb-operator-agent
          - image: kividb-operator-gui
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}--*
          merge-multiple: true

      # The same multi-arch tags in both registries, made from the per-arch
      # images on GHCR (imagetools copies them across registries).
      - name: Create and push manifest lists
        env:
          SRC: ${{ env.GHCR }}/${{ matrix.image }}
          VERSION: ${{ needs.version-check.outputs.version }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          digests=( *)
          if [ "${#digests[@]}" -lt 2 ] || [ ! -e "${digests[0]}" ]; then
            echo "::error::Expected an amd64 and an arm64 digest for ${SRC}, found ${#digests[@]}"
            exit 1
          fi
          refs=()
          for d in "${digests[@]}"; do
            refs+=("${SRC}@sha256:${d}")
          done
          for target in "${{ env.GHCR }}/${{ matrix.image }}" "${{ env.DOCKERHUB }}/${{ matrix.image }}"; do
            docker buildx imagetools create \
              -t "${target}:${VERSION}" \
              -t "${target}:latest" \
              "${refs[@]}"
            docker buildx imagetools inspect "${target}:${VERSION}"
          done

  chart:
    name: Package and push Helm chart
    needs: [version-check, dockerhub-check]
    runs-on: ubuntu-latest
    # id-token: cosign signs the chart keyless, with this run's identity.
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      chart_path: ${{ steps.package.outputs.chart_path }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: helm lint
        run: helm lint charts/kividb-operator

      - name: Package chart
        id: package
        run: |
          mkdir -p dist
          helm package charts/kividb-operator --destination dist/
          chart_path="$(ls dist/kividb-operator-chart-*.tgz)"
          echo "chart_path=$chart_path" >> "$GITHUB_OUTPUT"

      # helm push appends Chart.yaml's name ("kividb-operator-chart") to the
      # path, so the chart lands at .../kividb-operator-chart, apart from the
      # kividb-operator image. Docker Hub's OCI endpoint for Helm is
      # registry-1.docker.io.
      - name: Push chart to GHCR
        id: push-ghcr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "${{ steps.package.outputs.chart_path }}" oci://${{ env.GHCR }} 2>&1 | tee push.log
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -1)"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Artifact Hub shows the chart as Signed when it finds a cosign
      # signature next to it in the registry. Verify with:
      #   cosign verify ghcr.io/kividbio/kividb-operator-chart:<version> \
      #     --certificate-identity-regexp '^https://github.com/kividbio/kividb-operator/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: sigstore/cosign-installer@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign chart on GHCR
        run: cosign sign --yes "${{ env.GHCR }}/kividb-operator-chart@${{ steps.push-ghcr.outputs.digest }}"

      - name: Push chart to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin
          helm push "${{ steps.package.outputs.chart_path }}" oci://registry-1.docker.io/kividb

      - name: Upload packaged chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz

  github-release:
    name: Create GitHub Release
    needs: [version-check, images-manifest, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download packaged chart
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: dist

      - name: Extract changelog section for this version
        id: changelog
        run: |
          version="${{ needs.version-check.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            notes="$(awk -v ver="$version" '
              BEGIN { found=0 }
              /^## \[/ {
                if (found) exit
                if (index($0, "[" ver "]") > 0) { found=1; next }
                next
              }
              found { print }
            ' CHANGELOG.md)"
          else
            notes=""
          fi
          if [ -z "$notes" ]; then
            notes="No changelog entry found for $version in CHANGELOG.md."
          fi
          # GITHUB_OUTPUT multi-line value.
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: kividb-operator ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          # The CRDs too: Helm never upgrades them, and docs/RELEASING.md
          # tells users to apply them from here.
          files: |
            dist/*.tgz
            config/crd/bases/*.yaml
