{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kividb-operator.fullname" . }}-manager-rolebinding
  labels:
    {{- include "kividb-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kividb-operator.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kividb-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
