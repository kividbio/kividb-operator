{{- if and .Values.gui.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kividb-operator.fullname" . }}-gui-rolebinding
  labels:
    {{- include "kividb-operator.gui.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kividb-operator.fullname" . }}-gui-role
subjects:
  - kind: ServiceAccount
    name: {{ include "kividb-operator.gui.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
