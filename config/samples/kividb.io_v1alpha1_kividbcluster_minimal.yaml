# Smallest valid KividbCluster: only the one required spec field
# (spec.storage.size). spec.image is left unset here, so the operator
# uses its release default (docker.io/kividb/kividb:v1.1.2 for 0.5.3).
# Pin spec.image explicitly for a different tag/variant (e.g.
# "docker.io/kividb/kividb:v1.1.2-tls"). Everything else takes the CRD's
# defaults: replicas=2
# (i.e. 1 master + 2 replicas = 3 pods total), port 6380, no
# configRef/aclConfigRef (so: built-in kividb defaults, open passwordless
# access -- fine for a scratch/dev cluster, not for anything reachable
# outside a trusted network), no backups (no snapshotConfigRef), no
# monitoring, automatic failover enabled.
apiVersion: kividb.io/v1alpha1
kind: KividbCluster
metadata:
  name: kividb-minimal
  namespace: default
spec:
  storage:
    size: 5Gi
