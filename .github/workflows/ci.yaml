name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  # Keep in sync with go.mod's `go` directive (and the golang:*-bookworm
  # builder image in the Dockerfiles).
  GO_VERSION: "1.25"

jobs:
  go:
    name: Go build / vet / test / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # go.sum is not committed yet (see docs/_internal-spec.md) -- `go mod
      # tidy` fetches and pins real module versions/checksums. GitHub-hosted
      # runners have network access, so this is expected to succeed here
      # even though it cannot be run in the sandboxed environment the
      # initial source was written in.
      - name: go mod tidy
        run: go mod tidy

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race -coverprofile=cover.out

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out
          if-no-files-found: ignore

  helm:
    name: Helm lint / template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: helm lint
        run: helm lint charts/kividb-operator

      - name: helm template (sanity render)
        run: helm template kividb-operator charts/kividb-operator > /dev/null

  # Native per-arch builds (no QEMU): amd64 on ubuntu-latest, arm64 on
  # ubuntu-24.04-arm. Mirrors the release workflow's model so CI catches
  # Dockerfile breakage on both arches without emulated builds.
  docker:
    name: Docker build ${{ matrix.name }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manager
            dockerfile: ./Dockerfile
            tag: kividb-operator:ci
            platform: linux/amd64
            runner: ubuntu-latest
          - name: manager
            dockerfile: ./Dockerfile
            tag: kividb-operator:ci
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - name: agent
            dockerfile: ./Dockerfile.agent
            tag: kividb-operator-agent:ci
            platform: linux/amd64
            runner: ubuntu-latest
          - name: agent
            dockerfile: ./Dockerfile.agent
            tag: kividb-operator-agent:ci
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - name: gui
            dockerfile: ./Dockerfile.gui
            tag: kividb-operator-gui:ci
            platform: linux/amd64
            runner: ubuntu-latest
            optional: true
          - name: gui
            dockerfile: ./Dockerfile.gui
            tag: kividb-operator-gui:ci
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            optional: true
    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [ "${{ matrix.optional }}" = "true" ]; then
              echo "::warning::${{ matrix.dockerfile }} not found, skipping"
            else
              echo "::error::${{ matrix.dockerfile }} required but missing"
              exit 1
            fi
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.present == 'true'

      - name: Build ${{ matrix.name }} (${{ matrix.platform }})
        if: steps.check.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          provenance: false
          tags: ${{ matrix.tag }}
