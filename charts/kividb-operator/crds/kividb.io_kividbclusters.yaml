---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kividbclusters.kividb.io
  labels:
    app.kubernetes.io/name: kividb-operator
    app.kubernetes.io/managed-by: kividb-operator
spec:
  group: kividb.io
  names:
    kind: KividbCluster
    listKind: KividbClusterList
    plural: kividbclusters
    singular: kividbcluster
    shortNames:
      - kdb
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Master
          type: string
          jsonPath: .status.masterPod
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            KividbCluster describes a single-master, N-replica KiviDB
            (Redis-compatible) cluster: storage, scheduling constraints,
            exposed Services, monitoring, and failover behavior.
            Configuration, ACL users, and scheduled backups are set via
            separate KividbConfig / KividbAclConfig / KividbSnapshotConfig
            resources, referenced by name.
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [storage]
              properties:
                replicas:
                  type: integer
                  minimum: 0
                  default: 2
                  description: Number of replica pods in addition to the single master. Total pods = replicas+1.
                image:
                  type: string
                  description: >-
                    kividb container image, e.g.
                    "quay.io/kividbio/kividb:v1.0.3". Defaults to
                    quay.io/kividbio/kividb:v1.0.3 if unset -- set this explicitly
                    to pin a version. Used verbatim; never derived or
                    modified from variant below.
                variant:
                  type: string
                  default: standard
                  enum: [standard, tls, lua, full]
                  description: >-
                    Declares which build of kividb image actually is:
                    informational only, does not change which image gets
                    pulled. Tells the operator whether to wire up
                    variant-specific configuration (TLS cert mounting/CLI
                    flags). Not validated against image -- the operator
                    emits a guidance Event on a likely mismatch instead.
                imagePullPolicy:
                  type: string
                  enum: [Always, IfNotPresent, Never]
                imagePullSecrets:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                agentImage:
                  type: string
                  description: kividb-operator sidecar agent image. Defaults to the operator's bundled version.
                exporterImage:
                  type: string
                  description: >-
                    Prometheus redis_exporter sidecar image, added only when
                    spec.monitoring.enabled is true. Defaults to the
                    operator's bundled oliver006/redis_exporter version.
                port:
                  type: integer
                  default: 6380
                  description: RESP protocol port kividb listens on.
                configRef:
                  type: object
                  required: [name]
                  description: >-
                    Names a KividbConfig in the same namespace, providing
                    kividb.conf directives and TLS settings. Optional.
                  properties:
                    name: {type: string}
                aclConfigRef:
                  type: object
                  required: [name]
                  description: >-
                    Names a KividbAclConfig in the same namespace, providing
                    ACL users and/or requirepass. Optional: omit for an
                    open, passwordless default user.
                  properties:
                    name: {type: string}
                snapshotConfigRef:
                  type: object
                  required: [name]
                  description: >-
                    Names a KividbSnapshotConfig in the same namespace,
                    providing the backup schedule and S3 destination.
                    Optional: omit to disable scheduled backups.
                  properties:
                    name: {type: string}
                storage:
                  type: object
                  required: [size]
                  properties:
                    size:
                      type: string
                      description: 'PVC capacity, e.g. "10Gi".'
                    storageClassName:
                      type: string
                    accessModes:
                      type: array
                      items: {type: string}
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Standard Kubernetes ResourceRequirements for the kividb container.
                agentResources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Standard Kubernetes ResourceRequirements for the agent sidecar container.
                exporterResources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Standard Kubernetes ResourceRequirements for the redis_exporter sidecar container.
                tolerations:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  description: Standard Kubernetes Tolerations applied to every pod.
                nodeSelector:
                  type: object
                  additionalProperties: {type: string}
                affinity:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Standard Kubernetes Affinity. If unset, a default preferred anti-affinity is injected.
                podAnnotations:
                  type: object
                  additionalProperties: {type: string}
                podLabels:
                  type: object
                  additionalProperties: {type: string}
                terminationGracePeriodSeconds:
                  type: integer
                  format: int64
                services:
                  type: object
                  properties:
                    master:
                      type: object
                      description: Service exposing the current master pod.
                      properties:
                        type:
                          type: string
                          enum: [ClusterIP, NodePort, LoadBalancer]
                        loadBalancerIP: {type: string}
                        loadBalancerSourceRanges:
                          type: array
                          items: {type: string}
                        annotations:
                          type: object
                          additionalProperties: {type: string}
                    replicas:
                      type: object
                      description: Service load-balancing across all replica pods.
                      properties:
                        type:
                          type: string
                          enum: [ClusterIP, NodePort, LoadBalancer]
                        loadBalancerIP: {type: string}
                        loadBalancerSourceRanges:
                          type: array
                          items: {type: string}
                        annotations:
                          type: object
                          additionalProperties: {type: string}
                monitoring:
                  type: object
                  properties:
                    enabled: {type: boolean}
                    serviceMonitor: {type: boolean}
                failover:
                  type: object
                  properties:
                    enabled: {type: boolean}
                    unhealthyThresholdSeconds:
                      type: integer
                      format: int32
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Provisioning, Running, Degraded, FailingOver, Error]
                masterPod:
                  type: string
                pods:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      role: {type: string}
                      ready: {type: boolean}
                      replicationOffset:
                        type: integer
                        format: int64
                lastFailoverTime:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
