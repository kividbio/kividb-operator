# Full-featured KividbCluster sample exercising every major spec field.
#
# Prerequisites, in order:
#   kubectl apply -f kividb.io_v1alpha1_kividbcluster_full-secrets.yaml
#   kubectl apply -f kividb.io_v1alpha1_kividbconfig_full.yaml
#   kubectl apply -f kividb.io_v1alpha1_kividbaclconfig_full.yaml
#   kubectl apply -f kividb.io_v1alpha1_kividbsnapshotconfig_full.yaml
#   kubectl apply -f kividb.io_v1alpha1_kividbcluster_full.yaml
apiVersion: kividb.io/v1alpha1
kind: KividbCluster
metadata:
  name: kividb-full
  namespace: default
spec:
  replicas: 3 # 1 master + 3 replicas = 4 pods total
  image: quay.io/kividbio/kividb:v1.0.2
  imagePullPolicy: IfNotPresent
  # imagePullSecrets:
  #   - name: quay-pull-secret
  agentImage: quay.io/kividbio/kividb-operator-agent:0.1.0
  port: 6380

  # Configuration, ACL users, and the backup schedule/destination are all
  # separate, standalone, reusable resources -- referenced here by name,
  # not embedded. Create/edit them independently of this KividbCluster,
  # and reuse the same KividbConfig/KividbAclConfig/KividbSnapshotConfig
  # across multiple clusters if you want identical settings everywhere.
  configRef:
    name: kividb-full-config
  aclConfigRef:
    name: kividb-full-acl
  snapshotConfigRef:
    name: kividb-full-hourly-backup

  storage:
    size: 20Gi
    storageClassName: standard-rwo
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

  agentResources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

  tolerations:
    - key: "workload-class"
      operator: "Equal"
      value: "database"
      effect: "NoSchedule"

  nodeSelector:
    workload-class: database

  podAnnotations:
    prometheus.io/scrape: "true"

  terminationGracePeriodSeconds: 90

  services:
    master:
      type: LoadBalancer
      annotations:
        # Example cloud-provider annotation (AWS NLB); adjust or remove for
        # your provider (GKE/AKS use different annotation keys, and on
        # bare-metal/kind you'd typically leave this as ClusterIP or use
        # MetalLB instead).
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
        service.beta.kubernetes.io/aws-load-balancer-internal: "true"
      loadBalancerSourceRanges:
        - "10.0.0.0/8"
    replicas:
      type: ClusterIP

  monitoring:
    # Adds a third "redis-exporter" container (oliver006/redis_exporter,
    # port 9121) to every pod, in addition to the agent's own always-on
    # lightweight /metrics.
    enabled: true
    serviceMonitor: true

  failover:
    enabled: true
    unhealthyThresholdSeconds: 30
