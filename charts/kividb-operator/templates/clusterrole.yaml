{{- if .Values.rbac.create }}
# Its rules mirror config/rbac/role.yaml exactly -- see the //+kubebuilder:rbac
# markers on KividbClusterReconciler in
# internal/controller/kividbcluster_controller.go for the source of truth.
#
# With watchNamespace set this is a Role in that namespace, so nothing
# the manager may do reaches past it.
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.watchNamespace }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
  name: {{ include "kividb-operator.clusterRoleName" . }}
  {{- if .Values.watchNamespace }}
  namespace: {{ .Values.watchNamespace }}
  {{- end }}
  labels:
    {{- include "kividb-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - kividb.io
    resources:
      - kividbclusters
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - kividb.io
    resources:
      - kividbclusters/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - kividb.io
    resources:
      - kividbclusters/finalizers
    verbs:
      - update
  - apiGroups:
      - kividb.io
    resources:
      - kividbconfigs
      - kividbaclconfigs
      - kividbsnapshotconfigs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kividb.io
    resources:
      - kividbsnapshots
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - kividb.io
    resources:
      - kividbsnapshots/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - kividb.io
    resources:
      - kividbdbops
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - kividb.io
    resources:
      - kividbdbops/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - batch
    resources:
      - cronjobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
{{- end }}
