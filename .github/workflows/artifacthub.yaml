name: Artifact Hub metadata

# Pushes artifacthub-repo.yml into the chart's OCI repository as the
# `artifacthub.io` tag, where Artifact Hub looks for it. Runs when the file
# changes on master, or by hand.
on:
  push:
    branches: [master]
    paths: [artifacthub-repo.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: Push artifacthub-repo.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oras-project/setup-oras@v1

      - name: Push to ghcr.io/kividbio/kividb-operator-chart:artifacthub.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/kividbio/kividb-operator-chart:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
