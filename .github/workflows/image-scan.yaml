name: Image scan

# Builds the manager, agent and GUI images (amd64) and scans each with Trivy.
# Called by ci.yaml on every PR and push, and by release.yaml before any
# image is pushed. A HIGH or CRITICAL vulnerability that has a fixed version
# fails the job; everything else is listed in the job summary only.
#
# Trivy is installed from its GitHub release and checked against a pinned
# sha256, not through aquasecurity/trivy-action (whose tags were rewritten
# to malicious commits in March 2026). To update: bump TRIVY_VERSION and
# set TRIVY_SHA256 from trivy_<version>_checksums.txt of that release.
on:
  workflow_call:

permissions:
  contents: read

env:
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf

jobs:
  trivy:
    name: Trivy ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kividb-operator
            dockerfile: Dockerfile
          - image: kividb-operator-agent
            dockerfile: Dockerfile.agent
          - image: kividb-operator-gui
            dockerfile: Dockerfile.gui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build ${{ matrix.image }}
        run: docker build -t "scan/${{ matrix.image }}:ci" -f "${{ matrix.dockerfile }}" .

      - name: Install Trivy ${{ env.TRIVY_VERSION }}
        run: |
          set -euo pipefail
          tgz="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tgz}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" trivy
          sudo install -m 0755 "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
          trivy --version

      # Every finding, any severity, fixed or not: for the job summary.
      - name: Scan (report)
        run: |
          set -euo pipefail
          trivy image --scanners vuln --format table --exit-code 0 \
            "scan/${{ matrix.image }}:ci" | tee "$RUNNER_TEMP/report.txt"
          {
            echo "### Trivy: ${{ matrix.image }}"
            echo '```'
            cat "$RUNNER_TEMP/report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan (fail on fixable HIGH/CRITICAL)
        run: |
          trivy image --scanners vuln --skip-db-update \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "scan/${{ matrix.image }}:ci"
