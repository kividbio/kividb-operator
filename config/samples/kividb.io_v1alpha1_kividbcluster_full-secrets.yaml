# Companion Secrets for kividb.io_v1alpha1_kividbcluster_full.yaml.
#
# Create these BEFORE applying the KividbCluster (the controller resolves
# every secretRef during reconcile and will simply retry with a "secret ...
# not found" reconcile error, visible via `kubectl describe kividbcluster
# kividb-full`, until they exist -- it will not get stuck any other way,
# but nothing will become Ready until this Secret is present).
#
# Passwords below are throwaway examples for a sample manifest -- replace
# them, and prefer creating these via `kubectl create secret generic
# --from-literal` or a sealed-secrets/external-secrets pipeline rather than
# committing real credentials in a repo.
apiVersion: v1
kind: Secret
metadata:
  name: kividb-full-user-passwords
  namespace: default
  labels:
    app.kubernetes.io/name: kividb
    app.kubernetes.io/instance: kividb-full
type: Opaque
stringData:
  default-password: "change-me-default-user-password"
  app-password: "change-me-app-user-password"
---
# Referenced by spec.backup.s3.credentialsSecretRef. Keys default to
# "accessKeyId"/"secretAccessKey" unless overridden (see
# accessKeyIdKey/secretAccessKeyKey on S3CredentialsSecretRef).
apiVersion: v1
kind: Secret
metadata:
  name: kividb-full-s3-credentials
  namespace: default
  labels:
    app.kubernetes.io/name: kividb
    app.kubernetes.io/instance: kividb-full
type: Opaque
stringData:
  accessKeyId: "minioadmin"
  secretAccessKey: "change-me-minio-secret-key"
