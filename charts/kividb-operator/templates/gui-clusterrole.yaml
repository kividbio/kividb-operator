{{- if and .Values.gui.enabled .Values.rbac.create }}
# Management GUI ClusterRole. Still never grants Secrets. Extends the
# read-only surface with create on kividbdbops (restart ops) and get on
# pods/log (log viewer). Its rules mirror config/gui/rbac.yaml.
#
# With watchNamespace set this is a Role in that namespace; the one
# cluster-scoped read it needs, StorageClasses, is in
# gui-storageclass-reader.yaml.
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.watchNamespace }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
  name: {{ include "kividb-operator.fullname" . }}-gui-role
  {{- if .Values.watchNamespace }}
  namespace: {{ .Values.watchNamespace }}
  {{- end }}
  labels:
    {{- include "kividb-operator.gui.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - kividb.io
    resources:
      - kividbclusters
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - kividb.io
    resources:
      - kividbsnapshotconfigs
      - kividbsnapshots
      - kividbdbops
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kividb.io
    resources:
      - kividbdbops
    verbs:
      - create
  {{- if not .Values.watchNamespace }}
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
    verbs:
      - get
      - list
  {{- end }}
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - cronjobs
    verbs:
      - get
      - list
      - watch
  # A sharded cluster's "Take snapshot": a Job from its backup CronJob.
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ""
    resources:
      - services
      - events
    verbs:
      - get
      - list
      - watch
  # An Event on the cluster for a shard promote, which the GUI asks the
  # engine for itself.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
{{- end }}
